# 本機開發用 Docker Compose；目前僅提供可持久化的 PostgreSQL 16 資料庫服務。
# 極速開發：docker compose up db -d 啟動資料庫，後端以 dotnet run/watch 於本機連線。
services:
  db:
    image: postgres:16
    container_name: my-work-item-db
    # 資料庫名稱與開發帳密皆由環境變數提供（見 .env.example）；未提供時採用本機開發預設值。
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-my_work_item}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    # 使用 named volume 持久化資料，容器停止或重建後資料仍保留。
    volumes:
      - pgdata:/var/lib/postgresql/data
    # healthcheck 讓 depends_on 與 docker compose --wait 能判斷資料庫是否就緒。
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-my_work_item}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: 91app-backend/backend-dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-my_work_item};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Jwt__Issuer: ${JWT_ISSUER:-MyWorkItem.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-MyWorkItem.Web}
      Jwt__Key: ${JWT_KEY:-demo-only-jwt-signing-key-change-before-production}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8000}:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend/91app-frontend
      dockerfile: frontend-dockerfile
      args:
        NEXT_PUBLIC_PASSWORD_SALT: ${NEXT_PUBLIC_PASSWORD_SALT:-MyWorkItem-System-Salt-v1}
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://backend:8080}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-network

volumes:
  pgdata:
    name: my-work-item-pgdata

networks:
  app-network:
    name: my-work-item-network
